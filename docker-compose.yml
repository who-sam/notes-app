version: '3.8'

services:
  backend:
    build: ./backend
    container_name: notes-backend
    environment:
      - FLASK_ENV=development
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"    # expose Flask dev server
    restart: unless-stopped
    networks:
      - notes-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile   # a dev Dockerfile that runs `npm start`
    container_name: notes-frontend
    ports:
      - "80:80"    # React dev server
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - notes-network

networks:
  notes-network:
    driver: bridge

